name: Preserve previous timetable address
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-redirect.yml'
      - 'scripts/build-pages-redirect.mjs'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-redirect
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - run: node scripts/build-pages-redirect.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/pages-redirect
          retention-days: 1
      - uses: actions/deploy-pages@v4
        id: deployment
